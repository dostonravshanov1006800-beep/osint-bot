name: OSINT bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: osint-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Poll Telegram
        run: node bot.js
        env:
          OSINT_BOT_TOKEN: ${{ secrets.OSINT_BOT_TOKEN }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
