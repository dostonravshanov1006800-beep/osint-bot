name: OSINT bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: osint-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Poll Telegram
        run: |
          curl -fsSL "https://raw.githubusercontent.com/dostonravshanov1006800-beep/osint-bot/main/bot.js" -o bot.js
          node bot.js
        env:
          OSINT_BOT_TOKEN: ${{ secrets.OSINT_BOT_TOKEN }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
